; sailoQ remote - PlatformIO
; Compilar: boton "Build" (check) de PlatformIO. Grabar: "Upload" (flecha) con ST-Link en el conector PROG.
; La placa (STM32L071CBT6) se define en boards/sailoq_remote_l071cb.json porque PlatformIO no trae
; una "generic" para este micro.

[env:sailoq_remote]
platform = ststm32
board = sailoq_remote_l071cb
framework = stm32cube             ; HAL de ST, sin CubeMX
upload_protocol = stlink
debug_tool = stlink
; Libreria de radio sailoQ (protocolo y driver del nRF24), compartida con la lite, la pro y el actuador.
; Mientras se desarrolla se usa la copia local (clon del repositorio, al lado de este proyecto).
lib_deps =
    symlink://../sailoQ_radio
build_flags =
    -Wall
    -Iinclude
    -DSQ_DEBUG_UART=1             ; 1 = mensajes por el puerto serie de DBG (TX, 115200 8N1)
